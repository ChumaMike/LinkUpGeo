{% extends "base.html" %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-muted mb-3">404</div>
    <h2 class="fw-bold">Eish, that page doesn't exist!</h2>
    <p class="text-muted mb-4">The page you're looking for has moved or never existed.</p>
    <a href="{{ url_for('web.home') }}" class="btn btn-primary me-2">
        <i class="bi bi-house"></i> Go Home
    </a>
    <a href="{{ url_for('web.map_view') }}" class="btn btn-outline-primary">
        <i class="bi bi-geo-alt"></i> View Map
    </a>
</div>
{% endblock %}
